// ---- 描画 ----
let activeCat = "all";
const $ = (id) => document.getElementById(id);

function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(d){ const [y,m,day]=d.split("-"); return `${+m}月${+day}日`; }

function coverStyle(cat){
  const c = CAT[cat].color;
  return `background: linear-gradient(135deg, ${c}, color-mix(in srgb, ${c} 55%, #000));`;
}
function tagHtml(cat){
  const c = CAT[cat];
  return `<span class="tag" style="background:color-mix(in srgb, ${c.color} 16%, transparent); color:${c.color}">${c.icon} ${c.label}</span>`;
}

function buildCats(){
  const cats = ["all", ...Object.keys(CAT)];
  $("cats").innerHTML = cats.map(k=>{
    const label = k==="all" ? "🗂 すべて" : `${CAT[k].icon} ${CAT[k].label}`;
    return `<button class="cat ${k==="all"?"on":""}" data-k="${k}">${label}</button>`;
  }).join("");
  $("cats").addEventListener("click", e=>{
    const b = e.target.closest(".cat"); if(!b) return;
    activeCat = b.dataset.k;
    document.querySelectorAll(".cat").forEach(x=>x.classList.toggle("on", x===b));
    renderList();
  });
}

function renderLede(){
  const hero = ARTICLES.find(a=>a.featured);
  if(!hero){ $("ledeSlot").innerHTML = ""; return; }
  const show = activeCat === "all" || activeCat === hero.cat;
  $("ledeSlot").innerHTML = show ? `
    <div class="lede" data-id="${hero.id}">
      <span class="kicker">TOP STORY</span>
      ${tagHtml(hero.cat)}
      <h2>${esc(hero.title)}</h2>
      <div class="lead">${esc(hero.lead)}</div>
      <div class="src">${fmtDate(hero.date)} ・ ${hero.sources.map(s=>`<a href="${esc(s.u)}" target="_blank" rel="noopener">🔗 ${esc(s.n)}</a>`).join(" ")}</div>
    </div>` : "";
}

function renderSections(){
  const activeCats = Object.keys(CAT).filter(k => ARTICLES.some(a => !a.featured && a.cat === k));
  $("sections").innerHTML = activeCats.map((catKey, i) => {
    const items = ARTICLES.filter(a => !a.featured && a.cat === catKey);
    const hidden = !(activeCat === "all" || activeCat === catKey);
    const num = String(i + 1).padStart(2, "0");
    const storiesHtml = items.map(a => `
      <div class="story" data-id="${a.id}">
        <div class="date">${fmtDate(a.date)}</div>
        <div>
          <h4>${esc(a.title)}</h4>
          <p>${esc(a.lead)}</p>
          <div class="src">${a.sources.map(s=>`<a href="${esc(s.u)}" target="_blank" rel="noopener">🔗 ${esc(s.n)}</a>`).join(" ")}</div>
        </div>
      </div>`).join("");
    return `
      <section class="category${hidden ? " hidden" : ""}" data-cat="${catKey}">
        <div class="cat-head">
          <span class="num">${num}</span>
          <h3>${CAT[catKey].icon} ${CAT[catKey].label}</h3>
        </div>
        <hr class="cat-rule" />
        ${storiesHtml}
      </section>`;
  }).join("");
}

function renderList(){
  renderLede();
  renderSections();
}

// ---- 記事リーダー（サイト内で全文表示） ----
function openArticle(id){
  const a = ARTICLES.find(x=>x.id===id); if(!a) return;
  $("reader").innerHTML = `
    <div class="cover" style="${coverStyle(a.cat)}">
      ${CAT[a.cat].icon}
      <button class="close" id="closeBtn" aria-label="閉じる">×</button>
    </div>
    <div class="r-body">
      ${tagHtml(a.cat)}
      <h1>${esc(a.title)}</h1>
      <div class="r-meta"><span>🗓 ${fmtDate(a.date)}</span><span>・ 約${a.read}分</span><span>・ AI要約記事</span></div>
      ${a.body.map(p=>`<p class="para">${esc(p)}</p>`).join("")}
      <div class="points">
        <h4>📌 ポイント</h4>
        <ul>${a.points.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>
      </div>
      <div class="sources">
        <h4>参考ソース（一次情報）</h4>
        ${a.sources.map(s=>`<a href="${esc(s.u)}" target="_blank" rel="noopener">🔗 ${esc(s.n)}</a>`).join("")}
        <div class="disclaim">※ 本記事は上記の公開情報をもとに Claude が日本語で独自に要約・再構成したものです。正確性を期していますが、詳細は一次情報をご確認ください。</div>
      </div>
    </div>`;
  $("overlay").classList.add("show");
  document.body.style.overflow = "hidden";
  $("closeBtn").addEventListener("click", closeArticle);
}
function closeArticle(){
  $("overlay").classList.remove("show");
  document.body.style.overflow = "";
}

// クリックで記事を開く
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-id]");
  if(el){ openArticle(el.dataset.id); }
});
$("overlay").addEventListener("click", e=>{ if(e.target===$("overlay")) closeArticle(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeArticle(); });

// ---- 起動 ----
buildCats();
renderList();
</script>
